<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traceflow · 精简会话标记预览</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#202b3c;background:#f4f6fa;--mark:#477ee8;--mark-size:28px;--zoom:1;--surface:rgba(248,250,255,.86);--edge:#cad2df;--ink:#243149}
*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:40px 28px}header{margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:2px;color:#697b95}h1{font-size:30px;margin:10px 0}p{line-height:1.7;color:#66738a;margin:8px 0}button,select,input{font:inherit}button,select{border:1px solid #cbd4e3;background:white;border-radius:9px;padding:9px 12px;color:#28354c}button{cursor:pointer}button:hover{border-color:#477ee8}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #477ee8;outline-offset:3px}button[aria-pressed=true]{background:#e7efff;border-color:#477ee8;color:#2455b7}.controls{display:flex;gap:16px;flex-wrap:wrap;padding:18px;background:white;border:1px solid #e0e5ee;border-radius:14px;margin-bottom:24px}.control{display:flex;align-items:center;gap:8px;font-size:13px}.control input[type=color]{width:34px;height:34px;padding:2px;border:1px solid #cbd4e3;border-radius:7px}.swatches{display:flex;gap:5px}.swatch{width:25px;height:25px;padding:0;border-radius:6px;background:var(--swatch);border:2px solid transparent}.swatch[aria-pressed=true]{outline:2px solid #243149;outline-offset:2px;background:var(--swatch)}
.comparison{background:#fff;border:1px solid #e0e5ee;border-radius:16px;padding:20px;margin-bottom:24px}h2{font-size:18px;margin:0 0 10px}.desktop{background:linear-gradient(125deg,#e2e8f1,#c1cce0);border-radius:12px;padding:22px;overflow:auto}.desktop.dark{--surface:rgba(32,40,55,.9);--edge:#66728a;--ink:#f4f7ff;background:linear-gradient(125deg,#253149,#121b2f)}.desktop.paper{--surface:rgba(245,247,249,.95);--edge:#a5b2c4;background:#fff}.desktop.busy{background:repeating-linear-gradient(135deg,#afc9cf 0px,#afc9cf 24px,#e2c9b6 24px,#e2c9b6 48px)}.compare-row{display:flex;align-items:center;gap:20px;min-width:510px;margin:12px 0}.caption{font-size:12px;min-width:74px;color:var(--ink)}
.hud{height:40px;width:144px;display:flex;align-items:center;flex:none;border-radius:20px;background:var(--surface);border:1px solid var(--edge);color:var(--ink);box-shadow:0 3px 12px #18273a16}.marker-area{height:40px;width:40px;flex:none;display:flex;align-items:center;justify-content:center}.marker{width:var(--mark-size);height:var(--mark-size);fill:var(--mark);overflow:visible;flex:none}.lights{display:flex;gap:6px;align-items:center;justify-content:center;width:104px;height:40px;flex:none}.light{height:26px;width:26px;border-radius:50%;background:var(--c);opacity:.18;flex:none}.light.active{opacity:1;box-shadow:0 0 8px 1px color-mix(in srgb,var(--c) 32%,transparent)}.light.running.active{animation:breathe 2.4s ease-in-out infinite}.light.attention.active{animation:attention 1.1s ease-in-out infinite}.standard{width:420px}.standard .title{width:275px;font-size:13px;white-space:nowrap;overflow:hidden}.spark{width:40px;flex:none;text-align:center}.spark svg{width:19px;height:19px;fill:currentColor}.standard .lights{width:104px}.hud.reverse{flex-direction:row-reverse}.hud.vertical{flex-direction:column;width:40px;height:144px}.hud.vertical.reverse{flex-direction:column-reverse}.vertical .lights{flex-direction:column;width:40px;height:104px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid #e0e5ee;border-radius:16px;overflow:hidden}.card.selected{border-color:#477ee8;box-shadow:0 0 0 2px #477ee81a}.card-head{padding:18px 18px 12px}.number{font-size:12px;color:#5d77a1}h3{font-size:18px;margin:6px 0}.card p{font-size:13px;min-height:44px}.sample{display:flex;align-items:center;justify-content:center;min-height:150px;border-radius:0;padding:20px;overflow:auto}.sample:has(.vertical){min-height:330px}.sample .hud{transform:scale(var(--zoom));margin:28px}.card-bottom{padding:16px 18px}.choose{width:100%}.variants{display:flex;gap:14px;align-items:center;margin-bottom:14px}.variants .marker{width:22px;height:22px}.hint{font-size:12px;color:#758298}.result{margin-top:22px;border:1px solid #c8d8f5;background:#edf3ff;padding:16px;border-radius:12px;font-size:14px}.footer{font-size:12px;margin-top:18px;line-height:1.8;color:#778398}@keyframes breathe{50%{opacity:.55;box-shadow:0 0 4px #00b80020}}@keyframes attention{50%{opacity:.55}}body.paused .light{animation:none}@media(prefers-reduced-motion:reduce){.light{animation:none!important}}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){main{padding:24px 16px}.grid{grid-template-columns:1fr}h1{font-size:25px}}
</style>
<main>
<header><div class="eyebrow">TRACEFLOW / HUD</div><h1>用一块颜色，认出会话。</h1><p>统一形状，不同会话使用不同颜色。右侧三盏灯继续表达状态。<br>先选轮廓，再调整大小；以下均为可修改的设计候选。</p></header>
<div class="controls">
<label class="control">桌面背景<select id="backdrop"><option value="light">浅色桌面</option><option value="dark">深色桌面</option><option value="paper">白色窗口</option><option value="busy">复杂背景</option></select></label>
<label class="control">布局<select id="layout"><option value="horizontal">横向 · 标记在左</option><option value="horizontal reverse">横向 · 标记在右</option><option value="vertical">竖向 · 标记在上</option><option value="vertical reverse">竖向 · 标记在下</option></select></label>
<label class="control">状态<select id="state"><option value="running">运行中 · 绿灯</option><option value="attention">需要处理 · 红灯</option><option value="completed">已完成 · 黄灯</option><option value="idle">待机 · 全暗</option></select></label>
<label class="control">标记大小<select id="size"><option value="12">12 点</option><option value="14" selected>14 点</option><option value="16">16 点</option><option value="20">20 点</option><option value="24">24 点</option><option value="28">28 点</option><option value="30">30 点</option></select></label>
<label class="control">显示比例<select id="zoom"><option value="1">原尺寸</option><option value="2">放大两倍</option></select></label>
<div class="control">会话颜色<div class="swatches" id="swatches"></div><input type="color" id="color" value="#477ee8" aria-label="自定义会话标记颜色"></div>
<button id="motion" aria-pressed="false">暂停灯光动画</button>
</div>
<section class="comparison"><h2>占用空间对比</h2><p class="hint">此处固定原尺寸、横向布局。精简版拟为 144×40 点，长边比标准版减少约 66%。</p><div class="desktop" id="compare"><div class="compare-row"><span class="caption">标准模式</span><div class="hud standard"><span class="spark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 2 2.8 7.2L20 12l-7.2 2.8L10 22l-2.8-7.2L0 12l7.2-2.8ZM20 1l1.1 2.9L24 5l-2.9 1.1L20 9l-1.1-2.9L16 5l2.9-1.1Z"/></svg></span><span class="title">优化会话管理与展示方式</span><div class="lights"></div></div></div><div class="compare-row"><span class="caption">精简模式</span><div class="hud" id="compact"><div class="marker-area" id="current-marker"></div><div class="lights"></div></div></div></div></section>
<section class="grid" id="cards" aria-label="会话标记形状比较"></section>
<div class="result" id="result" role="status" aria-live="polite">已确定视觉方向：C · 菱形，14 点。仍可切换其他方案比较。</div>
<p class="footer">浏览器概念预览，尚未接入应用。灯的排列、直径与间距参考现有 HUD；材质与动效为模拟，原生效果待实现后核验。<br>悬停标记可查看示例标题。颜色负责会话身份，灯色负责状态；网页选择仅用于比较，不修改真实会话。</p>
</main>
<script>
const options=[
['A','圆角方形','推荐：色块面积最大，小圆角与圆灯区分明确。','<rect x="1" y="1" width="30" height="30" rx="5"/>'],
['B','六边形','轮廓独特，有徽章感；颜色面积也较充足。','<path d="M8 2H24L32 16 24 30H8L0 16Z"/>'],
['C','菱形','方向感鲜明；同尺寸下填色面积较小。','<path d="M16 0 32 16 16 32 0 16Z"/>'],
['D','切角方形','保留大色块，用切角增加辨识度。','<path d="M7 1H25L31 7V25L25 31H7L1 25V7Z"/>'],
['E','盾形','上宽下尖，区别明显；可能联想到安全功能。','<path d="M3 2H29V16Q29 24 16 32Q3 24 3 16Z"/>'],
['F','五角星','对照方案：容易认出，但色块较碎、带收藏意味。','<path d="m16 0 4.3 10.4 11.2 1-8.5 7.4 2.7 11L16 24 6.3 29.8 9 18.8.5 11.4l11.2-1Z"/>']
];
const colors=['#477ee8','#9963dd','#e458a3','#d77b23','#1597a4','#597344'];let chosen='C';
const marker=(id,color)=>{const item=options.find(o=>o[0]===id);return `<svg class="marker" viewBox="0 0 32 32" role="img" aria-label="示例会话：优化会话管理与展示方式" ${color?`style="fill:${color}"`:''}><title>优化会话管理与展示方式</title>${item[3]}</svg>`};
const lampHTML=['attention','completed','running'].map((kind,i)=>`<span class="light ${kind}" style="--c:${['#ff0000','#ffff00','#00bb00'][i]}"></span>`).join('');
document.querySelector('#swatches').innerHTML=colors.map((c,i)=>`<button class="swatch" style="--swatch:${c}" data-color="${c}" aria-label="会话颜色 ${i+1}" aria-pressed="${i===0}"></button>`).join('');
document.querySelector('#cards').innerHTML=options.map(([id,name,desc])=>`<article class="card ${id===chosen?'selected':''}" data-id="${id}"><div class="card-head"><span class="number">方案 ${id}${id==='A'?' · 推荐':''}</span><h3>${name}</h3><p>${desc}</p></div><div class="sample desktop"><div class="hud candidate" role="img" aria-label="${name}会话标记与三盏状态灯"><div class="marker-area">${marker(id)}</div><div class="lights"></div></div></div><div class="card-bottom"><div class="variants" aria-label="不同会话颜色比较">${colors.slice(0,5).map(c=>marker(id,c)).join('')}</div><button class="choose" data-id="${id}" aria-pressed="${id===chosen}">选择 ${id} · ${name}</button></div></article>`).join('');
document.querySelectorAll('.lights').forEach(el=>el.innerHTML=lampHTML);
function update(){const bg=document.querySelector('#backdrop').value;document.querySelectorAll('.desktop').forEach(el=>{el.classList.remove('dark','paper','busy');if(bg!=='light')el.classList.add(bg)});document.querySelectorAll('.candidate').forEach(el=>el.className='hud candidate '+document.querySelector('#layout').value);document.documentElement.style.setProperty('--mark-size',document.querySelector('#size').value+'px');document.documentElement.style.setProperty('--zoom',document.querySelector('#zoom').value);document.documentElement.style.setProperty('--mark',document.querySelector('#color').value);const state=document.querySelector('#state').value;document.querySelectorAll('.light').forEach(el=>el.classList.toggle('active',el.classList.contains(state)));document.querySelector('#current-marker').innerHTML=marker(chosen);document.querySelectorAll('.swatch').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.color===document.querySelector('#color').value)));document.querySelector('#compact').setAttribute('aria-label','精简模式示例：'+options.find(o=>o[0]===chosen)[1]);}
document.querySelectorAll('select,input').forEach(el=>el.addEventListener('input',update));
document.querySelectorAll('.swatch').forEach(el=>el.addEventListener('click',()=>{document.querySelector('#color').value=el.dataset.color;update()}));
document.querySelectorAll('.choose').forEach(el=>el.addEventListener('click',()=>{chosen=el.dataset.id;document.querySelectorAll('.choose').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c.dataset.id===chosen));document.querySelector('#result').textContent=`已暂选 ${chosen} · ${options.find(o=>o[0]===chosen)[1]}。请在聊天中告诉我选择或修改建议。`;update()}));
document.querySelector('#motion').addEventListener('click',e=>{const paused=document.body.classList.toggle('paused');e.target.setAttribute('aria-pressed',String(paused));e.target.textContent=paused?'恢复灯光动画':'暂停灯光动画'});update();
</script>
</html>
